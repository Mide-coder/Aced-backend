[project]
name = "aced-backend"
version = "0.1.0"
description = "Aced - University Tutoring Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlmodel==0.0.21",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.12",
    "slowapi==0.1.9",
    "sentry-sdk[fastapi]==2.19.0",
    "alembic==1.14.0",
    "httpx==0.27.2",
    "boto3==1.35.99",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
